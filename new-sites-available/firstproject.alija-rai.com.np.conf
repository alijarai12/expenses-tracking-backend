server {
    server_name firstproject.alija-rai.com.np 20.120.97.51;



    location / {
        root /var/www/expense-track-frontend-app/;
        index index.html;
        try_files $uri /index.html;
    }


    location /static/ {
        alias /home/deployuser/expenses-tracking-backend/staticfiles/;
    }



    location /api/ {
        proxy_pass http://unix:/home/deployuser/expenses-tracking-backend/gunicorn.sock; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fix CORS Issues
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        add_header Access-Control-Allow-Credentials true;
}


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/firstproject.alija-rai.com.np/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/firstproject.alija-rai.com.np/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = firstproject.alija-rai.com.np) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name firstproject.alija-rai.com.np 20.120.97.51;
    return 404; # managed by Certbot


}

